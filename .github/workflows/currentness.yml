name: Currentness

on:
  pull_request:
    paths:
      - 'tools/**/*.md'
      - 'skills/**/*.md'
      - 'frameworks/**/*.md'
      - 'workflows/**/*.md'
      - 'scripts/check-currentness.mjs'
      - 'scripts/check-currentness.test.mjs'
      - 'scripts/currentness-inventory.mjs'
      - 'scripts/currentness-inventory.test.mjs'
      - 'scripts/currentness-delta.mjs'
      - 'scripts/currentness-delta.test.mjs'
      - '.github/workflows/currentness.yml'
  push:
    branches: [main]
    paths:
      - 'tools/**/*.md'
      - 'skills/**/*.md'
      - 'frameworks/**/*.md'
      - 'workflows/**/*.md'
      - 'scripts/check-currentness.mjs'
      - 'scripts/check-currentness.test.mjs'
      - 'scripts/currentness-inventory.mjs'
      - 'scripts/currentness-inventory.test.mjs'
      - 'scripts/currentness-delta.mjs'
      - 'scripts/currentness-delta.test.mjs'
      - '.github/workflows/currentness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  currentness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test currentness tooling
        run: node --test scripts/check-currentness.test.mjs scripts/currentness-inventory.test.mjs scripts/currentness-delta.test.mjs

      - name: Determine changed time-sensitive cards
        id: changed
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
          else
            base="HEAD^"
          fi

          git diff --name-only --diff-filter=ACMRD "$base" "$GITHUB_SHA" -- \
            'tools/**/*.md' 'skills/**/*.md' 'frameworks/**/*.md' 'workflows/**/*.md' \
            > /tmp/currentness-delta-files.txt

          git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- \
            'tools/**/*.md' 'skills/**/*.md' 'frameworks/**/*.md' 'workflows/**/*.md' \
            > /tmp/currentness-files.txt

          count=$(grep -c . /tmp/currentness-files.txt || true)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Build reviewer currentness evidence
        shell: bash
        run: |
          mkdir -p currentness-artifacts
          node scripts/currentness-inventory.mjs > currentness-artifacts/currentness-inventory.md
          node scripts/currentness-inventory.mjs --format=json > currentness-artifacts/currentness-inventory.json
          mapfile -t delta_files < /tmp/currentness-delta-files.txt
          node scripts/currentness-delta.mjs --base="${{ steps.changed.outputs.base }}" "${delta_files[@]}" > currentness-artifacts/currentness-delta.md
          node scripts/currentness-delta.mjs --base="${{ steps.changed.outputs.base }}" --format=json "${delta_files[@]}" > currentness-artifacts/currentness-delta.json
          cat currentness-artifacts/currentness-delta.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat currentness-artifacts/currentness-inventory.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload currentness evidence
        uses: actions/upload-artifact@v4
        with:
          name: currentness-inventory
          path: currentness-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Validate changed cards
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: |
          mapfile -t files < /tmp/currentness-files.txt
          node scripts/check-currentness.mjs --max-age-days=120 "${files[@]}"
